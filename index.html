<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRON GRIND | Epic Cinematic</title>
    <link rel="icon" type="image/png" href="assets/icons/app-icon.png">
    <link rel="apple-touch-icon" href="assets/icons/app-icon.png">
    <link rel="stylesheet" href="style_part1.css">
    <link rel="stylesheet" href="style_part2.css">
</head>

<body>
    <div id="cinematic-container">
        <div id="camera-rig">
            
            <!-- VFX LAYER -->
            <div id="vfx-layer">
                <canvas id="particle-canvas"></canvas>
                <div id="fog-volume-1"></div>
                <div id="fog-volume-2"></div>
                <div id="volumetric-light"></div>
                <div id="depth-of-field"></div>
                <div id="vignette"></div>
                <div id="frost-overlay"></div>
                <div id="light-sweep"></div>
                <div id="lightning-flash"></div>
                <div id="chromatic-aberration"></div>
                <div id="scanlines"></div>
                <div id="grain"></div>
                <div id="letterbox-top"></div>
                <div id="letterbox-bottom"></div>
            </div>

            <!-- CINEMATIC LAYER -->
            <div id="cinematic-layer">
                
                <!-- Environment -->
                <div id="environment-container">
                    <div class="mountain-layer" id="mountain-back"></div>
                    <div class="mountain-layer" id="mountain-mid"></div>
                    <div class="mountain-layer" id="mountain-front"></div>
                    <div id="ground-plane"></div>
                    <div id="horizon-glow"></div>
                    <div id="sky-aurora"></div>
                </div>

                <!-- Vanguard (Spear) -->
                <div id="vanguard-container">
                    <div id="spear-shadow"></div>
                    <div id="iron-spear">
                        <div class="spear-shaft"></div>
                        <div class="spear-tip"></div>
                        <div class="spear-glow"></div>
                    </div>
                    <div id="impact-crater">
                        <div class="crater-ring"></div>
                        <div class="crater-ring"></div>
                        <div class="crater-ring"></div>
                        <div class="crater-glow"></div>
                    </div>
                </div>

                <!-- Gauges -->
                <div id="gauges-container">
                    <div class="gauge" id="gauge-strength">
                        <div class="gauge-outer-ring"></div>
                        <div class="gauge-inner-ring"></div>
                        <div class="gauge-glass"></div>
                        <div class="gauge-needle"></div>
                        <div class="gauge-hub"></div>
                        <div class="gauge-label">STRENGTH</div>
                        <div class="gauge-value">00</div>
                    </div>
                    <div class="gauge" id="gauge-grind">
                        <div class="gauge-outer-ring"></div>
                        <div class="gauge-inner-ring"></div>
                        <div class="gauge-glass"></div>
                        <div class="gauge-needle"></div>
                        <div class="gauge-hub"></div>
                        <div class="gauge-label">GRIND</div>
                        <div class="gauge-value">00</div>
                    </div>
                    <div class="gauge" id="gauge-progress">
                        <div class="gauge-outer-ring"></div>
                        <div class="gauge-inner-ring"></div>
                        <div class="gauge-glass"></div>
                        <div class="gauge-needle"></div>
                        <div class="gauge-hub"></div>
                        <div class="gauge-label">PROGRESS</div>
                        <div class="gauge-value">00</div>
                    </div>
                </div>

                <!-- IG Emblem -->
                <div id="logo-container">
                    <div id="ig-emblem-wireframe"></div>
                    <div id="ig-emblem">
                        <span class="ig-text">IG</span>
                        <div id="emblem-frost"></div>
                        <div id="emblem-glow"></div>
                    </div>
                    <div id="brand-text">IRON GRIND</div>
                    <div id="tagline-text">EARN YOUR POWER</div>
                </div>
            </div>

            <!-- UI LAYER -->
            <div id="ui-layer">
                <div id="ui-frame-top"></div>
                <div id="start-container">
                    <button id="start-btn">
                        <span class="btn-text">ENTER THE GRIND</span>
                    </button>
                    <div id="loading-text">CALIBRATING SYSTEMS...</div>
                </div>
                <button id="skip-btn">SKIP INTRO</button>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="audio-ambience" src="assets/audio/intro-ambience.mp3" preload="auto"></audio>
    <audio id="audio-boot" src="assets/audio/machine-boot.mp3" preload="auto"></audio>
    <audio id="audio-gauge" src="assets/audio/gauge-activate.mp3" preload="auto"></audio>
    <audio id="audio-surge" src="assets/audio/energy-surge.mp3" preload="auto"></audio>
    <audio id="audio-impact" src="assets/audio/logo-impact.mp3" preload="auto"></audio>

    <script src="engine_part1.js"></script>
    <script src="engine_part2.js"></script>
</body>
</html>
